<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSA Batangas Document Tracking System</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1t4M3XEIg5J8vBaOXoauvQ99Sw47ncFSc" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8fafc; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="studioFrame" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
  <script>
    const base = "https://script.google.com/macros/s/AKfycbylUYkm6Uv2P5zwJiyVHf3XEvUUTj2FtTxXtBo2-VuxfihFDtojDkuM2MFTVLWFTt66/exec";
    document.getElementById("studioFrame").src = base + window.location.search;
    if (window.location.search.includes("sso=") && window.history && window.history.replaceState) {
      setTimeout(() => window.history.replaceState({}, "", window.location.pathname), 1500);
    }
  </script>
</body>
</html>
